name: Continuous Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (Arch Linux Environment)
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Initialize Arch Linux & Dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm base-devel sudo git rust cargo cargo-deb cargo-generate-rpm zstd binutils desktop-file-utils wget file
          useradd user -G wheel && echo "user ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown user -R ..
          chown user -R /tmp
          git config --global --add safe.directory '*'

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Date-Based Version
        id: versioning
        run: |
          DATE=$(date -u +'%Y.%m.%d')
          git fetch --tags --force || true

          # Find highest build counter for today
          HIGHEST_NUM=0
          for tag in $(git tag -l "v${DATE}.*"); do
            NUM="${tag##*.}"
            if [[ "$NUM" =~ ^[0-9]+$ ]]; then
              if (( NUM > HIGHEST_NUM )); then
                HIGHEST_NUM=$NUM
              fi
            fi
          done

          NEXT_NUM=$((HIGHEST_NUM + 1))
          VERSION="v${DATE}.${NEXT_NUM}"
          CLEAN_VERSION="${DATE}.${NEXT_NUM}"

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "CLEAN_VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "Release Version: ${VERSION}"

      - name: Compile & Package All Distros
        run: |
          ./scripts/build-arch-packages.sh

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edged-${{ env.VERSION }}
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Edged ${{ env.VERSION }}
          body: |
            ## Edged ${{ env.VERSION }} 📐

            Automated release compiled on **Arch Linux** and generated on push to `master`.

            > **Notice**: Edged is an experimental project **vibecoded with Google Antigravity**.

            ### 📦 Available Packages & Formats

            | Distribution / Format | File | Installation Command |
            | :--- | :--- | :--- |
            | **Standalone Binary** | [`edged`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/edged) | `chmod +x edged && ./edged` |
            | **Arch Linux / Manjaro** | [`edged-${{ env.CLEAN_VERSION }}-1-x86_64.pkg.tar.zst`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/edged-${{ env.CLEAN_VERSION }}-1-x86_64.pkg.tar.zst) | `sudo pacman -U edged-*.pkg.tar.zst` |
            | **Debian / Ubuntu / Mint** | [`edged_${{ env.CLEAN_VERSION }}_amd64.deb`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/edged_${{ env.CLEAN_VERSION }}_amd64.deb) | `sudo apt install ./edged_*.deb` |
            | **Fedora / RHEL / openSUSE** | [`edged-${{ env.CLEAN_VERSION }}-1.x86_64.rpm`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/edged-${{ env.CLEAN_VERSION }}-1.x86_64.rpm) | `sudo dnf install ./edged-*.rpm` |
            | **Universal AppImage** | [`edged-${{ env.VERSION }}-x86_64.AppImage`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/edged-${{ env.VERSION }}-x86_64.AppImage) | `chmod +x edged-*.AppImage && ./edged-*.AppImage` |
            | **Tarball Archive** | [`edged-${{ env.VERSION }}-x86_64-linux.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/edged-${{ env.VERSION }}-x86_64-linux.tar.gz) | `tar -xzf edged-*.tar.gz && cd edged-* && sudo ./install.sh` |

            ### 🔐 Checksums & Verification
            Verify downloads using the provided `SHA256SUMS.txt`:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          files: dist/*
          draft: false
          prerelease: false
