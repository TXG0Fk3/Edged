<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bg)" stroke="#334155" stroke-width="3" />

  <!-- Grid lines (subtle blueprint) -->
  <line x1="16" y1="80" x2="240" y2="80" stroke="#1E293B" stroke-width="1.5" />
  <line x1="16" y1="128" x2="240" y2="128" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.5" />
  <line x1="16" y1="176" x2="240" y2="176" stroke="#1E293B" stroke-width="1.5" />
  <line x1="80" y1="16" x2="80" y2="240" stroke="#1E293B" stroke-width="1.5" />
  <line x1="128" y1="16" x2="128" y2="240" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.5" />
  <line x1="176" y1="16" x2="176" y2="240" stroke="#1E293B" stroke-width="1.5" />

  <!-- Measurement rectangle -->
  <rect x="52" y="64" width="152" height="128" rx="8" fill="rgba(59, 130, 246, 0.12)" stroke="url(#accent)" stroke-width="3" filter="url(#glow)" />

  <!-- Top ruler ticks -->
  <line x1="52" y1="64" x2="52" y2="52" stroke="#38BDF8" stroke-width="2.5" />
  <line x1="77" y1="64" x2="77" y2="56" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="102" y1="64" x2="102" y2="54" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="128" y1="64" x2="128" y2="50" stroke="#38BDF8" stroke-width="2.5" />
  <line x1="154" y1="64" x2="154" y2="54" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="179" y1="64" x2="179" y2="56" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="204" y1="64" x2="204" y2="52" stroke="#38BDF8" stroke-width="2.5" />

  <!-- Left ruler ticks -->
  <line x1="52" y1="64" x2="40" y2="64" stroke="#38BDF8" stroke-width="2.5" />
  <line x1="52" y1="96" x2="44" y2="96" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="52" y1="128" x2="38" y2="128" stroke="#38BDF8" stroke-width="2.5" />
  <line x1="52" y1="160" x2="44" y2="160" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="52" y1="192" x2="40" y2="192" stroke="#38BDF8" stroke-width="2.5" />

  <!-- Dimension Badge in Center -->
  <rect x="84" y="114" width="88" height="28" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1.5" />
  <text x="128" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC" text-anchor="middle">1920 × 1080</text>
</svg>
