[package]
name = "edged"
version = "0.1.0"
edition = "2021"
authors = ["Edged Contributors"]
description = "High-quality PowerToys Screen Ruler replica natively built for Wayland (Hyprland, GNOME, Sway)"
license = "MIT OR Apache-2.0"

[dependencies]
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
cairo-rs = "0.22"
pango = "0.22"
pangocairo = "0.22"
gdk4 = "0.11"
glib = "0.22"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6.0"
ashpd = { version = "0.13", default-features = false, features = ["screenshot", "tokio"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "macros", "rt-multi-thread"] }
