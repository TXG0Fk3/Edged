[package]
name = "edged"
version = "0.1.0"
edition = "2021"
authors = ["Edged Contributors"]
description = "High-quality PowerToys Screen Ruler replica natively built for Wayland (Hyprland, GNOME, Sway)"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6.0"
ashpd = { version = "0.13", default-features = false, features = ["screenshot", "tokio"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "macros", "rt-multi-thread"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland"] }
egui = "0.37"
arboard = "3.4"
